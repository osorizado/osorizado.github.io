<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación a Comer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffe4e1;
            color: #333;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Página de inicio con el sobre */
        #envelope-page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe4e1;
            flex-direction: column;
        }

        /* Texto arriba del sobre */
        .invitation-text {
            font-size: 30px;
            color: #dd77b1;
            margin-bottom: 20px;
        }

        /* Estilos del sobre */
        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: white;
            border: 2px solid #dd77b1;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 20px;
            overflow: hidden;
            z-index: 2;
        }

        /* La parte superior del sobre */
        .flap {
            position: absolute;
            top: 0;
            left: 50%;
            width: 0;
            height: 0;
            border-left: 200px solid transparent;
            border-right: 200px solid transparent;
            border-top: 100px solid #dd77b1;
            transform: translateX(-50%);
            transform-origin: top;
            transition: transform 1s ease-in-out;
            z-index: 1;
        }

        .envelope.open .flap {
            transform: translateX(-50%) rotateX(-180deg);
        }

        /* Botones */
        .button {
            margin-top: 10px;
            padding: 10px 40px;
            background-color: #dd77b1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 2;
            display: block;
            text-align: center;
        }

        .button:hover {
            background-color: #ffe4e1;
            color: #dd77b1;
        }
    </style>
</head>
<body>

    <!-- Página inicial con el sobre -->
    <div id="envelope-page">
        <div class="invitation-text">¡Tienes una invitación, Flavita!</div>
        <div class="envelope" id="envelope">
            <div class="flap"></div>
            <button id="open-btn" class="button">Abrir</button>
        </div>
        <button id="redirect-btn" class="button">Ahora abre este</button>
    </div>

    <script>
        // Botón "Abrir" para mostrar la invitación
        document.getElementById('open-btn').addEventListener('click', function() {
            const envelope = document.getElementById('envelope');
            envelope.classList.add('open');

            setTimeout(function() {
                document.getElementById('envelope-page').style.display = 'none';
                window.location.href = "invitacion.html"; // Redirige a la misma invitación
            }, 1000);
        });

        // Botón "Ahora abre este" que redirige a la misma página
        document.getElementById('redirect-btn').addEventListener('click', function() {
            window.location.href = "invitacion.html"; // Redirige a la misma invitación
        });
    </script>

</body>
</html>
